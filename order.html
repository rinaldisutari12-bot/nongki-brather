<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesan di Nongki Brother</title>
<meta name="theme-color" content="#181412">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#181412; --surface:#221d19; --surface-2:#2d2621; --line:#3d342c;
  --fg:#f1e8dc; --muted:#a99b8b;
  --accent:#eea133; --accent-ink:#f2ad4a; --on-accent:#1d1308;
  --leaf:#7cc487; --danger:#f07a68;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#efede9; --surface:#fbfaf8; --surface-2:#e5e1da; --line:#d2ccc2;
    --fg:#241d17; --muted:#6a5f53;
    --accent:#e9a232; --accent-ink:#8c4a00; --on-accent:#1f1409;
    --leaf:#2b7a3a; --danger:#b4372a;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
h1,h2,p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted);font-size:14px}
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
header b{font:800 22px/1 var(--f-display);display:block}
header small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
header strong{color:var(--accent-ink)}
.grp{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item.hasf{grid-template-columns:76px minmax(0,1fr) auto}
.item .th{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.item b{font-weight:600;overflow-wrap:anywhere}
.item .pr{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:22px;font-weight:700;line-height:1}
.stp button.add{width:auto;padding:0 18px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:15px}
.stp output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.field::placeholder{color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.primary{width:100%;padding:15px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
.primary:disabled{opacity:.4}
.ghost{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .in{max-width:640px;margin:0 auto}
.card{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sum li{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum ul{list-style:none;margin:8px 0;padding:0}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-top:6px}
.total strong{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.status{text-align:center;padding:36px 8px}
.status h2{font:800 24px/1.2 var(--f-display);margin:10px 0 8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin:0 auto;animation:p 1.2s ease-in-out infinite}
.dot.ok{background:var(--leaf);animation:none}
.dot.no{background:var(--danger);animation:none}
@keyframes p{50%{opacity:.35;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.mejas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mejas button{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 16px/1 var(--f-display)}
.err{color:var(--danger);margin-top:10px}
.vt{display:block;font-size:13px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.cnt{display:block;font-size:13px;color:var(--accent-ink);font-weight:600}
.modal{position:fixed;inset:0;z-index:90;background:rgb(0 0 0 / .55);display:flex;align-items:flex-end;justify-content:center}
.optcard{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.optcard h2{font:800 20px/1.2 var(--f-display)}
.og{margin-top:14px}
.og label{margin:0 0 6px}
.ochips{display:flex;flex-wrap:wrap;gap:8px}
.oc{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.oc small{margin-left:6px;color:var(--muted);font-weight:500}
.oc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.oc[aria-pressed="true"] small{color:var(--on-accent)}
.sum li{align-items:center}
.sum .stp{flex:none}
</style>
</head>
<body>
<header><div class="wrap"><b>Nongki Brother</b><small id="where">Memuat…</small></div></header>

<main class="wrap">
  <section id="s-load"><p class="muted" style="margin-top:24px" id="load-msg">Memuat menu…</p></section>

  <section id="s-pick" hidden>
    <h2 class="grp">Kamu duduk di meja berapa?</h2>
    <div class="mejas" id="pick"></div>
  </section>

  <section id="s-menu" hidden>
    <div id="menu"></div>
    <label for="nama">Nama kamu (supaya kasir tahu pesanan siapa)</label>
    <input class="field" id="nama" maxlength="30" placeholder="Contoh: Andi" autocomplete="given-name">
  </section>

  <section id="s-review" hidden>
    <h2 class="grp" style="margin-top:18px">Cek pesananmu</h2>
    <div class="card sum"><ul id="rev"></ul><div class="total"><span>Perkiraan total</span><strong id="rev-t">Rp 0</strong></div></div>
    <p class="muted" style="margin-top:10px">Pembayaran dilakukan di kasir. Pesanan ini baru dikonfirmasi setelah diterima kasir.</p>
    <p class="err" id="err" role="alert"></p>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:14px">
      <button type="button" class="ghost" id="back">Ubah</button>
      <button type="button" class="primary" id="send">Kirim pesanan</button>
    </div>
  </section>

  <section id="s-status" hidden>
    <div class="status"><div class="dot" id="st-dot"></div><h2 id="st-h"></h2><p class="muted" id="st-p"></p>
      <div class="card sum" id="st-bill" hidden style="text-align:left;margin-top:20px"></div>
      <button type="button" class="ghost" id="again" style="margin-top:22px" hidden>Pesan lagi</button></div>
  </section>

  <section id="s-fail" hidden><p class="muted" style="margin-top:24px" id="fail-msg"></p></section>
</main>

<div class="modal" id="opt" hidden><div class="optcard" id="opt-body" role="dialog" aria-modal="true"></div></div>

<div class="bar" id="bar" hidden><div class="in"><button type="button" class="primary" id="next">Lihat pesanan</button></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var nf = new Intl.NumberFormat("id-ID");
  var rp = function (n) { return "Rp " + nf.format(Math.round(n || 0)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var db, auth, fotos = {}, menu = [], mejas = [], meja = null, cart = [], unStatus = null, sending = false;

  function show(id) {
    ["load", "pick", "menu", "review", "status", "fail"].forEach(function (k) { $("#s-" + k).hidden = k !== id && !(id === "menu" && false); });
    $("#s-menu").hidden = id !== "menu";
    var bar = $("#bar");
    bar.hidden = id !== "menu";
    window.scrollTo(0, 0);
  }
  function fail(msg) { $("#fail-msg").textContent = msg; show("fail"); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } }

  function lkey(id, o, c) { return id + "|" + o.map(function (x) { return x.g + ":" + x.n; }).join(",") + "|" + c; }
  function sumH(o) { return o.reduce(function (a, x) { return a + x.h; }, 0); }
  function vtext(o) { return o.map(function (x) { return x.n; }).join(", "); }
  function byId(id) { return menu.filter(function (m) { return m.id === id; })[0]; }
  function count() { return cart.reduce(function (a, l) { return a + l.q; }, 0); }
  function unit(l) { var m = byId(l.id); return m ? m.harga + sumH(l.o) : 0; }
  function total() { return cart.reduce(function (a, l) { return a + unit(l) * l.q; }, 0); }
  function qtyOf(id) { return cart.reduce(function (a, l) { return a + (l.id === id ? l.q : 0); }, 0); }
  function addLine(id, o, c, d) {
    var k = lkey(id, o, c), e = cart.filter(function (l) { return lkey(l.id, l.o, l.c) === k; })[0];
    if (e) { e.q += d; if (e.q > 20) e.q = 20; if (e.q <= 0) cart = cart.filter(function (l) { return l !== e; }); }
    else if (d > 0) cart.push({ id: id, q: d, o: o, c: c });
  }
  function renderMenu() {
    var cats = [];
    menu.forEach(function (m) { if (cats.indexOf(m.kat) < 0) cats.push(m.kat); });
    $("#menu").innerHTML = cats.map(function (c) {
      return '<h2 class="grp">' + esc(c) + "</h2>" + menu.filter(function (m) { return m.kat === c; }).map(function (m) {
        var q = qtyOf(m.id), id = esc(m.id), ctl;
        if (m.opsi.length) ctl = '<button type="button" class="stp-add add" data-pick="' + id + '">Pilih</button>';
        else ctl = q ? '<button type="button" data-d="-1" data-id="' + id + '" aria-label="Kurangi ' + esc(m.nama) + '">−</button><output>' + q + '</output><button type="button" data-d="1" data-id="' + id + '" aria-label="Tambah ' + esc(m.nama) + '">+</button>' : '<button type="button" class="add" data-d="1" data-id="' + id + '">Tambah</button>';
        var f = fotos[m.id];
        return '<div class="item' + (f ? " hasf" : "") + '">' + (f ? '<img class="th" src="' + esc(f) + '" alt="" loading="lazy">' : "") + '<div><b>' + esc(m.nama) + '</b><span class="pr">' + rp(m.harga) + (m.opsi.length ? " · ada pilihan" : "") + "</span>" + (m.opsi.length && q ? '<span class="cnt">' + q + " di keranjang</span>" : "") + '</div><div class="stp">' + ctl + "</div></div>";
      }).join("");
    }).join("");
    var n = count(), nx = $("#next");
    nx.disabled = !n;
    nx.textContent = n ? "Lihat pesanan · " + n + " item · " + rp(total()) : "Pilih menu dulu";
  }
  function renderReview() {
    $("#rev").innerHTML = cart.map(function (l) {
      var m = byId(l.id), k = esc(lkey(l.id, l.o, l.c)), det = (l.o.length ? vtext(l.o) : "") + (l.c ? (l.o.length ? " · " : "") + "“" + l.c + "”" : "");
      return "<li><span>" + esc(m ? m.nama : "?") + (det ? '<span class="vt">' + esc(det) + "</span>" : "") + '<span class="vt">' + rp(unit(l)) + " × " + l.q + " = " + rp(unit(l) * l.q) + '</span></span><div class="stp"><button type="button" data-rd="-1" data-k="' + k + '" aria-label="Kurangi">−</button><output>' + l.q + '</output><button type="button" data-rd="1" data-k="' + k + '" aria-label="Tambah">+</button></div></li>';
    }).join("");
    $("#rev-t").textContent = rp(total());
    $("#send").disabled = !cart.length;
  }
  $("#rev").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-rd]"); if (!b) return;
    var l = cart.filter(function (x) { return lkey(x.id, x.o, x.c) === b.dataset.k; })[0]; if (!l) return;
    addLine(l.id, l.o, l.c, Number(b.dataset.rd));
    if (!cart.length) { show("menu"); renderMenu(); return; }
    renderReview();
  });
  $("#menu").addEventListener("click", function (e) {
    var pk = e.target.closest("button[data-pick]");
    if (pk) { var m = byId(pk.dataset.pick); if (m) openOpt(m); return; }
    var b = e.target.closest("button[data-id]"); if (!b) return;
    addLine(b.dataset.id, [], "", Number(b.dataset.d));
    renderMenu();
  });

  /* ---------- modal pilihan ---------- */
  var optCtx = null;
  function optSelected() {
    var out = [];
    optCtx.m.opsi.forEach(function (g) {
      var n = optCtx.sel[g.g], p = n && g.pil.filter(function (x) { return x.n === n; })[0];
      if (p) out.push({ g: g.g, n: p.n, h: p.h });
    });
    return out;
  }
  function openOpt(m) { optCtx = { m: m, sel: {}, c: "", q: 1 }; renderOpt(); $("#opt").hidden = false; }
  function closeOpt() { $("#opt").hidden = true; optCtx = null; }
  function renderOpt() {
    if (!optCtx) return;
    var m = optCtx.m, o = optSelected(), miss = m.opsi.filter(function (g) { return g.wajib && !optCtx.sel[g.g]; });
    $("#opt-body").innerHTML = "<h2>" + esc(m.nama) + '</h2><p class="muted">' + rp(m.harga) + "</p>" + m.opsi.map(function (g) {
      return '<div class="og"><label>' + esc(g.g) + (g.wajib ? " (wajib pilih)" : " (boleh kosong)") + '</label><div class="ochips">' + g.pil.map(function (p) {
        return '<button type="button" class="oc" data-g="' + esc(g.g) + '" data-n="' + esc(p.n) + '" aria-pressed="' + (optCtx.sel[g.g] === p.n) + '">' + esc(p.n) + (p.h ? "<small>+" + rp(p.h) + "</small>" : "") + "</button>";
      }).join("") + "</div></div>";
    }).join("") + '<div class="og"><label>Jumlah</label><div class="stp"><button type="button" data-oq="-1" aria-label="Kurangi jumlah">−</button><output>' + optCtx.q + '</output><button type="button" data-oq="1" aria-label="Tambah jumlah">+</button></div></div><div class="og"><label for="opt-c">Catatan (boleh kosong)</label><input class="field" id="opt-c" maxlength="60" placeholder="Contoh: kurang manis" value="' + esc(optCtx.c) + '" autocomplete="off" style="margin:0"></div><div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px"><button type="button" class="ghost" data-oa="cancel">Batal</button><button type="button" class="primary" data-oa="ok"' + (miss.length ? " disabled" : "") + ">" + (miss.length ? "Pilih " + esc(miss[0].g) + " dulu" : "Tambah " + optCtx.q + " · " + rp((m.harga + sumH(o)) * optCtx.q)) + "</button></div>";
  }
  $("#opt").addEventListener("click", function (e) {
    if (!optCtx) return;
    if (e.target === $("#opt")) { closeOpt(); return; }
    var ci = $("#opt-c"); if (ci) optCtx.c = ci.value;
    var ch = e.target.closest("button.oc");
    if (ch) { var g = ch.dataset.g, n = ch.dataset.n, grp = optCtx.m.opsi.filter(function (x) { return x.g === g; })[0]; if (optCtx.sel[g] === n && !(grp && grp.wajib)) delete optCtx.sel[g]; else optCtx.sel[g] = n; renderOpt(); return; }
    var oq = e.target.closest("button[data-oq]");
    if (oq) { optCtx.q = Math.max(1, Math.min(20, optCtx.q + Number(oq.dataset.oq))); renderOpt(); return; }
    var oa = e.target.closest("button[data-oa]"); if (!oa) return;
    if (oa.dataset.oa === "cancel") { closeOpt(); return; }
    var m = optCtx.m, o = optSelected(), c = optCtx.c.trim().slice(0, 60), qn = optCtx.q;
    closeOpt(); addLine(m.id, o, c, qn); renderMenu();
  });
  $("#opt").addEventListener("input", function (e) { if (optCtx && e.target.id === "opt-c") optCtx.c = e.target.value; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && optCtx) closeOpt(); });

  $("#next").addEventListener("click", function () { if (!count()) return; renderReview(); $("#err").textContent = ""; show("review"); });
  $("#back").addEventListener("click", function () { show("menu"); renderMenu(); });

  function setMeja(m) {
    meja = m; $("#where").innerHTML = "Pesan untuk <strong>" + esc(m.nama) + "</strong>";
    renderMenu(); show("menu");
  }

  $("#send").addEventListener("click", function () {
    if (sending || !count()) return;
    sending = true; $("#send").disabled = true; $("#err").textContent = "";
    var items = cart.map(function (l) { var m = byId(l.id); return { id: l.id, n: m ? m.nama : "?", q: l.q, o: l.o.map(function (x) { return { g: x.g, n: x.n }; }), c: l.c }; });
    db.collection("pesanan").add({
      uid: auth.currentUser.uid, meja: meja.id, mejaNama: meja.nama, nama: $("#nama").value.trim().slice(0, 30),
      items: items, status: "baru", t: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function (ref) {
      lsSet("nb-last", ref.id + "|" + Date.now());
      cart = []; watchStatus(ref.id);
    }).catch(function (e) {
      console.error(e);
      $("#err").textContent = "Pesanan gagal terkirim. Cek sinyal lalu coba lagi, atau pesan langsung ke kasir.";
    }).then(function () { sending = false; $("#send").disabled = false; });
  });

  function billHtml(b) {
    var its = Array.isArray(b.items) ? b.items : [];
    var rows = its.map(function (i) {
      var q = Number(i.q) || 0, det = (i.v ? i.v : "") + (i.c ? (i.v ? " · " : "") + "“" + i.c + "”" : "");
      return "<li><span>" + esc(i.n || "?") + " × " + q + (det ? '<span class="vt">' + esc(det) + "</span>" : "") + "</span><span>" + rp((Number(i.h) || 0) * q) + "</span></li>";
    }).join("");
    var out = "<b>Bill</b><ul>" + rows + '</ul><div class="total"><span>Total</span><strong>' + rp(b.total) + "</strong></div>";
    if (b.gabung) out += '<p class="muted" style="margin-top:8px">Dibayar gabungan bersama bil lain di mejamu (total semua ' + rp(b.totalSemua) + ").</p>";
    else if (Number(b.bayar) > 0) out += '<p class="muted" style="margin-top:8px">Uang diterima ' + rp(b.bayar) + " · Kembalian " + rp(b.kembali) + "</p>";
    return out;
  }
  function watchStatus(id) {
    if (unStatus) unStatus();
    show("status");
    var dot = $("#st-dot"), h = $("#st-h"), p = $("#st-p"), ag = $("#again");
    unStatus = db.doc("pesanan/" + id).onSnapshot(function (sn) {
      var d = sn.exists ? sn.data() : {}, st = d.status || "baru", bl = $("#st-bill");
      dot.className = "dot" + (st === "diantar" || st === "selesai" ? " ok" : st === "ditolak" ? " no" : "");
      ag.hidden = st === "baru";
      bl.hidden = !(st === "selesai" && d.bill);
      if (!bl.hidden) bl.innerHTML = billHtml(d.bill);
      if (st === "selesai") { h.textContent = "Terima kasih!"; p.textContent = "Pembayaran sudah diterima. Ini bill kamu. Sampai ketemu lagi di Nongki Brother!"; lsSet("nb-last", ""); }
      else if (st === "diantar") { h.textContent = "Pesanan sudah diantar"; p.textContent = "Selamat menikmati! Pembayaran dilakukan di kasir ya."; }
      else if (st === "diterima") { h.textContent = "Menu sedang diproses"; p.textContent = "Pesananmu sedang disiapkan. Mohon ditunggu sebentar ya."; }
      else if (st === "ditolak") { h.textContent = "Maaf, belum bisa diproses"; p.textContent = "Silakan pesan langsung ke kasir."; }
      else { h.textContent = "Pesanan terkirim"; p.textContent = "Pesananmu sudah masuk ke kasir. Halaman ini otomatis berubah saat pesananmu diproses."; }
    }, function () { h.textContent = "Pesanan terkirim"; p.textContent = "Status tidak bisa ditampilkan, tapi pesananmu sudah masuk ke kasir."; dot.className = "dot ok"; });
  }
  $("#again").addEventListener("click", function () {
    if (unStatus) { unStatus(); unStatus = null; }
    if (!meja) { show("pick"); return; }
    show("menu"); renderMenu();
  });

  function normOpsi(a) {
    return (Array.isArray(a) ? a : []).map(function (g) {
      if (!g || !g.g || !Array.isArray(g.pil)) return null;
      var pil = g.pil.map(function (p) { return p && p.n ? { n: String(p.n).slice(0, 30), h: Math.max(0, Number(p.h) || 0) } : null; }).filter(Boolean);
      return pil.length ? { g: String(g.g).slice(0, 24), wajib: !!g.wajib, pil: pil } : null;
    }).filter(Boolean);
  }
  function start() {
    var q = new URLSearchParams(location.search).get("meja");
    var fp = db.collection("foto").get().then(function (sn) {
      var f = {}; sn.forEach(function (d) { var x = d.data(); if (x && typeof x.d === "string" && x.d.indexOf("data:image/") === 0) f[d.id] = x.d; });
      return f;
    }).catch(function () { return {}; });
    return Promise.all([db.doc("kasir/menu").get(), db.doc("kasir/meja").get(), fp]).then(function (r) {
      var md = r[0].exists ? r[0].data() : null, jd = r[1].exists ? r[1].data() : null;
      fotos = r[2] || {};
      menu = ((md && md.items) || []).filter(function (x) { return x && x.nama; }).map(function (x) { return { id: String(x.id), nama: String(x.nama), harga: Math.max(0, Number(x.harga) || 0), kat: String(x.kat || "Lainnya"), opsi: normOpsi(x.opsi) }; });
      mejas = ((jd && jd.list) || []).filter(function (x) { return x && x.nama; }).map(function (x) { return { id: String(x.id), nama: String(x.nama) }; });
      if (!menu.length) { $("#where").textContent = ""; return fail("Menu belum siap. Silakan pesan langsung ke kasir."); }
      var last = (lsGet("nb-last") || "").split("|");
      if (last[0] && Date.now() - Number(last[1]) < 3 * 36e5) { watchStatus(last[0]); }
      var m = mejas.filter(function (x) { return x.id === q; })[0];
      if (m) { $("#where").innerHTML = "Pesan untuk <strong>" + esc(m.nama) + "</strong>"; meja = m; if (!(last[0] && Date.now() - Number(last[1]) < 3 * 36e5)) { renderMenu(); show("menu"); } return; }
      $("#where").textContent = "Pilih mejamu";
      $("#pick").innerHTML = mejas.map(function (x) { return '<button type="button" data-id="' + esc(x.id) + '">' + esc(x.nama) + "</button>"; }).join("");
      if (!(last[0] && Date.now() - Number(last[1]) < 3 * 36e5)) show("pick");
    });
  }
  $("#pick").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]"); if (!b) return;
    var m = mejas.filter(function (x) { return x.id === b.dataset.id; })[0]; if (m) setMeja(m);
  });

  try {
    firebase.initializeApp(window.NB_FIREBASE);
    auth = firebase.auth(); db = firebase.firestore();
  } catch (e) { return fail("Gagal memuat. Cek internet lalu muat ulang halaman."); }
  auth.signInAnonymously().then(start).catch(function (e) {
    console.error(e);
    fail("Tidak bisa terhubung. Cek internet lalu muat ulang halaman, atau pesan langsung ke kasir.");
  });
})();
</script>
</body>
</html>
